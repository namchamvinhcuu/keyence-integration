name: 'publish'

# Build installer Windows + Linux, ký update artifact, tạo GitHub Release
# (draft) đính kèm installer + latest.json. Repo giữ PRIVATE — GitHub
# Release ở đây CHỈ để Nam tải file thủ công rồi upload lên server nội bộ
# khách hàng Youngmin, KHÔNG phải endpoint auto-update runtime (trạm sản
# xuất chỉ có LAN nội bộ, không ra Internet).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev build-essential patchelf

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Keyence Integration v__VERSION__'
          releaseBody: |
            Build tự động từ CI. File đính kèm CHỈ để tải thủ công rồi upload
            lên server nội bộ khách hàng Youngmin — KHÔNG phải nơi trạm sản
            xuất tự tải update (trạm chỉ có LAN nội bộ, không ra Internet).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
